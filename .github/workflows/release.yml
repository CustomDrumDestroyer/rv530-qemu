# Pre-built packages: QEMU with the rv530 for x86_64 Linux, Apple silicon
# macOS, Intel macOS and x86_64 Windows, with OVMF, the option ROMs and the scripts
# (scripts/package/build-release.sh).  A pushed tag v* makes a GitHub release
# with the packages, the QEMU source they were built from and checksums; a
# manual run (Actions > Release > Run workflow) only uploads them as
# artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  firmware:
    name: OVMF (x86_64 firmware, any host)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential uuid-dev nasm acpica-tools git
      - name: Build OVMF with the rv530 GOP driver
        run: snowleopard/build-ovmf.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ovmf
          path: |
            snowleopard/work/fw/OVMF_CODE.fd
            snowleopard/work/fw/OVMF_VARS.fd
          if-no-files-found: error

  build:
    name: ${{ matrix.name }}
    needs: firmware
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built on the oldest supported Ubuntu, so that the
          # package runs on distributions with this glibc or a newer one
          - name: linux-x86_64
            runs-on: ubuntu-22.04
          - name: macos-arm64
            runs-on: macos-15
          # GitHub's Intel macOS image; Homebrew no longer supports Intel
          # Macs, so its dependencies come from MacPorts
          - name: macos-x86_64
            runs-on: macos-15-intel
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Package name
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v=$GITHUB_REF_NAME; else v=dev-${GITHUB_SHA::7}; fi
          echo "PKG_NAME=rv530-qemu-$v-${{ matrix.name }}" >> "$GITHUB_ENV"

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ninja-build pkg-config \
            libglib2.0-dev libpixman-1-dev libgtk-3-dev libslirp-dev libpng-dev zlib1g-dev \
            libvulkan-dev glslang-tools patchelf curl xz-utils git cmake \
            libpulse-dev libasound2-dev
          # Ubuntu 22.04's Vulkan headers (1.3.204) predate
          # VK_KHR_portability_enumeration; newer headers in /usr/local/include
          # come first in the compiler's search path
          git clone -q --depth 1 -b v1.3.296 https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/vkh
          sudo cp -r /tmp/vkh/include/vulkan /tmp/vkh/include/vk_video /usr/local/include/
      # Ubuntu 22.04 has no shaderc package: build the pinned release, with
      # the glslang and SPIRV-Tools it pins, once, and cache it
      - name: shaderc cache (Linux)
        if: runner.os == 'Linux'
        id: shaderc
        uses: actions/cache@v4
        with:
          path: /opt/shaderc
          key: shaderc-v2025.4-ubuntu-22.04
      - name: shaderc (Linux)
        if: runner.os == 'Linux' && steps.shaderc.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 -b v2025.4 https://github.com/google/shaderc.git /tmp/shaderc
          (cd /tmp/shaderc && ./utils/git-sync-deps)
          cmake -S /tmp/shaderc -B /tmp/shaderc-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/shaderc -DCMAKE_INSTALL_LIBDIR=lib \
            -DSHADERC_SKIP_TESTS=ON -DSHADERC_SKIP_EXAMPLES=ON -DSHADERC_SKIP_COPYRIGHT_CHECK=ON \
            -DSPIRV_SKIP_TESTS=ON -DSPIRV_SKIP_EXECUTABLES=ON -DENABLE_GLSLANG_BINARIES=OFF
          cmake --build /tmp/shaderc-build
          sudo cmake --install /tmp/shaderc-build
      - name: shaderc environment (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "PKG_CONFIG_PATH=/opt/shaderc/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/shaderc/lib" >> "$GITHUB_ENV"
      - name: Dependencies (macOS, Homebrew)
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        run: |
          brew install ninja pkg-config glib pixman libslirp libpng \
            molten-vk vulkan-loader vulkan-headers shaderc glslang
      - name: Dependencies (macOS, MacPorts)
        if: runner.os == 'macOS' && runner.arch == 'X64'
        run: |
          curl -fsSLO https://github.com/macports/macports-base/releases/download/v2.12.7/MacPorts-2.12.7-15-Sequoia.pkg
          pkgutil --check-signature MacPorts-2.12.7-15-Sequoia.pkg | grep -q 'Developer ID Installer: Joshua Root'
          sudo installer -pkg MacPorts-2.12.7-15-Sequoia.pkg -target /
          echo /opt/local/bin >> "$GITHUB_PATH"
          echo /opt/local/sbin >> "$GITHUB_PATH"
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH
          sudo port -q selfupdate
          sudo port -N -q install ninja pkgconfig glib2 libpixman libslirp libpng \
            MoltenVK vulkan-loader vulkan-headers shaderc glslang

      - name: Unit tests
        shell: bash
        run: |
          cc=gcc; [ "$RUNNER_OS" = macOS ] && cc=clang
          for t in pvs raster tex us; do
            make -C qemu/hw/display/rv530/tests/$t CC=$cc check
          done
      - uses: actions/download-artifact@v4
        with:
          name: ovmf
          path: ovmf
      - name: Build the package
        shell: bash
        run: OVMF_DIR=$PWD/ovmf scripts/package/build-release.sh "$PKG_NAME" dist
      - name: Nothing loads from the build's package manager (macOS)
        if: runner.os == 'macOS'
        run: |
          # run the emulator itself, not the sh wrapper (SIP drops DYLD_*
          # variables for /bin/sh)
          DYLD_PRINT_LIBRARIES=1 "dist/$PKG_NAME/libexec/qemu-system-x86_64" -version 2> dyld.log
          if grep -E '/opt/homebrew|/opt/local|/usr/local' dyld.log; then exit 1; fi
          echo "$(grep -c . dyld.log) images loaded, none from a package manager"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: dist/${{ env.PKG_NAME }}.tar.gz
          if-no-files-found: error

  windows:
    name: windows-x86_64
    needs: firmware
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # the bash scripts must keep LF line endings
      - name: Line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make diffutils patch tar xz curl dosfstools
            mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-meson mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pixman mingw-w64-ucrt-x86_64-gtk3 mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-libslirp mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-vulkan-loader mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-shaderc mingw-w64-ucrt-x86_64-glslang mingw-w64-ucrt-x86_64-mtools
      - name: Package name
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v=$GITHUB_REF_NAME; else v=dev-${GITHUB_SHA::7}; fi
          echo "PKG_NAME=rv530-qemu-$v-windows-x86_64" >> "$GITHUB_ENV"
      - name: Unit tests
        run: |
          for t in pvs raster tex us; do
            make -C qemu/hw/display/rv530/tests/$t CC=gcc check
          done
      - uses: actions/download-artifact@v4
        with:
          name: ovmf
          path: ovmf
      - name: Build the package
        run: OVMF_DIR=$PWD/ovmf scripts/package/build-release.sh "$PKG_NAME" dist
      - name: Nothing loads from MSYS2
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & "dist\$env:PKG_NAME\bin\qemu-system-x86_64.exe" -version
          if ($LASTEXITCODE) { exit 1 }
          & "dist\$env:PKG_NAME\bin\qemu-img.exe" --version
          if ($LASTEXITCODE) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: dist/${{ env.PKG_NAME }}.zip
          if-no-files-found: error

  linux-distributions:
    name: Linux package on ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            setup: apt-get update -qq && apt-get install -y -qq --no-install-recommends libgtk-3-0 libvulkan1 >/dev/null
          - image: ubuntu:24.04
            setup: apt-get update -qq && apt-get install -y -qq --no-install-recommends libgtk-3-0t64 libvulkan1 >/dev/null
          - image: debian:12
            setup: apt-get update -qq && apt-get install -y -qq --no-install-recommends libgtk-3-0 libvulkan1 >/dev/null
          - image: fedora:latest
            setup: dnf install -y -q gtk3 vulkan-loader >/dev/null
          - image: archlinux:latest
            setup: pacman -Sy --noconfirm --needed gtk3 vulkan-icd-loader >/dev/null
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rv530-qemu-*-linux-x86_64
          merge-multiple: true
      - name: Smoke test in a clean container
        timeout-minutes: 15
        run: |
          tar -xzf rv530-qemu-*-linux-x86_64.tar.gz
          d=$(ls -d rv530-qemu-*-linux-x86_64/)
          docker run --rm -v "$PWD:/w" -w /w ${{ matrix.image }} sh -c \
            "${{ matrix.setup }} && scripts/package/smoke-test.sh '$d'"

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: [build, linux-distributions, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rv530-qemu-*
          path: dist
          merge-multiple: true
      - name: Source for the GPL
        run: |
          # the QEMU release the packages are built from, and this repository
          # at the tag (device, patches, scripts)
          curl -fsSL -o dist/qemu-11.1.3.tar.xz https://download.qemu.org/qemu-11.1.3.tar.xz
          git archive --prefix="rv530-qemu-$GITHUB_REF_NAME/" -o "dist/rv530-qemu-$GITHUB_REF_NAME-source.tar.gz" HEAD
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "rv530-qemu $GITHUB_REF_NAME" \
            --notes-file scripts/package/release-notes.md
